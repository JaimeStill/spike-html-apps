# Project kind: this spike builds a client application over the web stack's layers and a Go
# pipeline emulator, checked by `mise run check` (ESLint with the app tier's direction table,
# Prettier, shellcheck, tsc, the unit tier, and the seven Go steps). Its goals live in the
# coordinator's roadmap (standards-lab/context/roadmap.toml). `mise run currency` reports every
# mise tool, package.json pin, and go.mod go directive and direct requirement behind its latest.
# No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. The root releases
# nothing and runs no CI, so the merge doesn't wait on checks.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
