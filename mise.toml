# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
[settings]
task.run_auto_install = false

# The layers' Node toolchain, at their pins, and Go with golangci-lint at their latest.
[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
# From spike-html-apps-sdk (be6341d): mise.toml, its chrome-headless-shell pin.
[tools."http:chrome-headless-shell"]
version = "156.0.8078.73"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:77eb8d52798efc7a857ab61abcc62a456d8ea9635b02341d06dffee2761768c8", size = "126938225" }

[env]
# The root module alone, outside any go.work; and the pinned Go, never a toolchain go.mod asks
# for, so no Go step downloads one.
GOWORK = "off"
GOTOOLCHAIN = "local"
# The emulator's environment: config.local.json overlays config.json (loopback, debug logging).
EMULATOR_ENV = "local"
# The service's Go modules, as directories; the Go tasks run in each one.
GO_MODULES = "."

[tasks.preflight]
description = "Fail naming mise run install when the node_modules tooling is missing, and with the browser argument the pinned chrome-headless-shell; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, and shellcheck; reads no network, writes nothing"
depends = ["lint:eslint", "lint:format", "lint:shell"]

[tasks."lint:eslint"]
description = "Lint the code with ESLint (eslint.config.js), the app tier's direction in apps/ included; reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (.prettierrc.json, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

[tasks.types]
description = "Type-check tsconfig.json's inputs (eslint.config.js, vite.config.ts, and apps/) with tsc; reads no network, writes nothing"
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: the app tier's violation tree, linted in a scratch directory of TMPDIR, removed after; reads no network, writes nothing in the repository"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.js'"
dir = "{{config_root}}"

# Adapted from go-web-sdk-template (b6ad574): template/mise.toml, its check task as the
# go task, every module's seven steps; vet, fix, and lint take the integration tag so the
# integration suite compiles and lints too, and the go task runs only the unit tier.
[tasks.go]
description = "Build, vet, format-check, fix-check, tidy-check, test (-race), and lint (golangci-lint with .golangci.yml) every Go module, with or without the pipeline app's build; reads no network, writes nothing outside Go's caches"
# Each step compiles the embed of apps/pipeline/dist/, which build:app empties and rewrites; when
# the check runs both, the Go steps wait for the build to finish rather than read it mid-write.
wait_for = ["build:app"]
run = '''
set -eu
for mod in $GO_MODULES; do
  echo "go: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
'''
dir = "{{config_root}}"

# Adapted from go-web-sdk-template (b6ad574): template/mise.toml, its integration task.
# The suite builds cmd/server once with the race detector, into a temporary directory, embedding
# the pipeline app's build, and runs it as a subprocess on reserved loopback ports; the emulator
# has no backing service, so no compose stack wraps it.
[tasks."test:integration"]
description = "Run the integration tier after build:app: build cmd/server, embedding the pipeline app's build, and boot it on reserved loopback ports, through boot, both probes, the app at each mount, and the drain, and a binary built without the app refusing to start; reads no network, writes apps/pipeline/dist/ (gitignored) and nothing else outside TMPDIR and Go's caches"
# The binary refuses to start without the app's build, so the tier builds the app first.
depends = ["build:app"]
run = "go test -race -count=1 -tags integration ./integration/"
dir = "{{config_root}}"

# Adapted from spike-html-apps-sdk (be6341d): mise.toml, its test:browser task. The tier builds
# cmd/server once, embedding the pipeline app's build, into a temporary directory the task removes,
# and each file boots it on reserved loopback ports, under its own TMPDIR, as test/browser/support/
# emulator.js does.
[tasks."test:browser"]
description = "Run the browser tier after build:app: build cmd/server, embedding the pipeline app's build, boot it on reserved loopback ports, and load the app in the pinned chrome-headless-shell, through base agreement at each mount, the NATS adapter's live reads, and two instances side by side; reads no network, writes apps/pipeline/dist/ (gitignored) and nothing else outside TMPDIR and Go's caches"
depends = ["preflight browser", "build:app"]
run = '''
set -eu
bin=$(mktemp -d)
trap 'rm -rf "$bin"' EXIT
go build -o "$bin/server" ./cmd/server
EMULATOR_BINARY="$bin/server" BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) \
  node --test 'test/browser/*.test.js'
'''
dir = "{{config_root}}"

[tasks.serve]
description = "Build the pipeline app, then run the emulator locally under the local overlay, on localhost:8080, the app at /app; Ctrl-C drains it"
# The binary refuses to start without the app's build.
depends = ["build:app"]
run = "go run ./cmd/server"
dir = "{{config_root}}"

[tasks."build:app"]
description = "Build the pipeline app with Vite (vite.config.ts): apps/pipeline/src/ into apps/pipeline/dist/, with its manifest in .vite/manifest.json, recreating the committed dist/.gitkeep Vite's emptied outDir drops; reads no network, writes apps/pipeline/dist/"
depends = ["preflight"]
# Vite empties dist/ before it writes, the committed placeholder the Go embed of dist/ compiles
# against with no build included; touch puts the same empty file back, so the tree stays clean.
run = ["pnpm exec vite build", "touch apps/pipeline/dist/.gitkeep"]
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, test:unit, the Go steps, test:integration, and test:browser, the last two after the pipeline app's build; reads no network, writes apps/pipeline/dist/ (gitignored) and nothing else outside TMPDIR and Go's caches"
depends = ["lint", "types", "test:unit", "go", "test:integration", "test:browser"]

[tasks.install]
description = "Install every mise.toml pin, node_modules from pnpm-lock.yaml, and the root module's requirements into Go's module cache; reads the network, writes node_modules/ and Go's caches"
run = ["mise install", "pnpm install --frozen-lockfile", "go mod download"]
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), and go.mod go directive and direct requirement behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
