# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
[settings]
task.run_auto_install = false

# The layers' Node toolchain, at their pins, and Go with golangci-lint at their latest.
[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[env]
# The root module alone, outside any go.work; and the pinned Go, never a toolchain go.mod asks
# for, so no Go step downloads one.
GOWORK = "off"
GOTOOLCHAIN = "local"
# The emulator's environment: config.local.json overlays config.json (loopback, debug logging).
EMULATOR_ENV = "local"
# The service's Go modules, as directories; the Go tasks run in each one.
GO_MODULES = "."

[tasks.preflight]
description = "Fail naming mise run install when the node_modules tooling is missing; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, and shellcheck; reads no network, writes nothing"
depends = ["lint:eslint", "lint:format", "lint:shell"]

[tasks."lint:eslint"]
description = "Lint the code with ESLint (eslint.config.js), the app tier's direction in apps/ included; reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (.prettierrc.json, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

[tasks.types]
description = "Type-check tsconfig.json's inputs (eslint.config.js, and apps/) with tsc; reads no network, writes nothing"
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: the app tier's violation tree, linted in a scratch directory of TMPDIR, removed after; reads no network, writes nothing in the repository"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.js'"
dir = "{{config_root}}"

# From go-web-sdk-template template/v0.13.0 (b6ad574): template/mise.toml, its check task as the
# go task, every module's seven steps; vet, fix, and lint take the integration tag so the
# integration suite compiles and lints too, and the go task runs only the unit tier.
[tasks.go]
description = "Build, vet, format-check, fix-check, tidy-check, test (-race), and lint (golangci-lint with .golangci.yml) every Go module; reads no network, writes nothing outside Go's caches"
run = '''
set -eu
for mod in $GO_MODULES; do
  echo "go: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
'''
dir = "{{config_root}}"

# From go-web-sdk-template template/v0.13.0 (b6ad574): template/mise.toml, its integration task.
# The suite builds cmd/server once with the race detector, into a temporary directory, and runs it
# as a subprocess on reserved loopback ports; the emulator has no backing service, so no compose
# stack wraps it.
[tasks."test:integration"]
description = "Run the integration tier: build cmd/server and boot it on reserved loopback ports, through boot, both probes, and the drain; reads no network, writes nothing outside TMPDIR and Go's caches"
run = "go test -race -count=1 -tags integration ./integration/"
dir = "{{config_root}}"

[tasks.serve]
description = "Run the emulator locally under the local overlay, on localhost:8080; Ctrl-C drains it"
run = "go run ./cmd/server"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, test:unit, the Go steps, and test:integration; reads no network, writes nothing outside TMPDIR and Go's caches"
depends = ["lint", "types", "test:unit", "go", "test:integration"]

[tasks.install]
description = "Install every mise.toml pin and node_modules from pnpm-lock.yaml; reads the network, writes node_modules/"
run = ["mise install", "pnpm install --frozen-lockfile"]
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool, package.json pin, and go.mod go directive and direct requirement behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
